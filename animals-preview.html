<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>花园伙伴 · 动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e7;color:#394e36;font-family:system-ui,-apple-system,sans-serif}main{max-width:1060px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;font-weight:600;margin:12px 0}p{color:#748168;line-height:1.8}.eyebrow{font-size:12px;letter-spacing:3px}a{color:#476640}section{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}article{border:1px solid #d9decc;background:#fffdf5;border-radius:24px;overflow:hidden}.stage{position:relative;display:grid;place-items:center;height:310px;background:radial-gradient(ellipse at 50% 82%,#c6d697,transparent 58%),#e7edcf}.stage:after{content:'';position:absolute;bottom:33px;width:120px;height:20px;background:#62764722;border-radius:50%}canvas{position:relative;z-index:1;width:256px;height:256px}.controls{padding:24px}h2{margin:0 0 6px;font-size:24px}.tag{font-size:12px;color:#788567}select,button{font:inherit;border:1px solid #cbd5bd;border-radius:12px;background:#f6f8ec;padding:10px 12px;color:#3e5d34;cursor:pointer}select{width:100%;margin:18px 0 12px}.buttons{display:flex;gap:8px}input{width:100%;accent-color:#738c50;margin:20px 0 8px}.caption{font-size:12px;color:#7a846f;display:flex;justify-content:space-between}.note{border-top:1px solid #d9decc;margin-top:32px;padding-top:18px;font-size:13px}footer{margin-top:24px;font-size:13px}@media(max-width:650px){main{padding:24px 16px}section{grid-template-columns:1fr}header{display:block}h1{font-size:28px}}
</style>
<main><header><div><div class="eyebrow">HABIT GARDEN · ANIMATION STUDY</div><h1>花园里的两位小伙伴</h1><p>慢慢走，吃一口，再打个盹。</p></div><a href="index.html">打开花园 →</a></header>
<section id="cards"></section><p class="note">每只伙伴有 64 帧原始素材。选择动作可以循环预览，也可以暂停逐帧查看；左右翻转用于匹配行走方向。此页不会读取或修改你的花园存档。</p><footer>第一版动作样片 · 原有手绘角色延续</footer></main>
<script src="animal-atlas.js?v=20260915-animals-v1-restored"></script><script src="animal-motion.js?v=20260915-animals-v1-restored"></script><script src="animal-renderer.js?v=20260915-animals-v1-restored"></script>
<script>
const labels={idle:'发呆 · 呼吸与眨眼',walk:'走路 · 斜前方',walkBack:'走路 · 斜后方',eat:'进食 · 慢慢咀嚼',sleep:'睡觉 · 安静呼吸',stand:'起身 · 坐姿到站姿',sit:'坐下 · 站姿到坐姿',lie:'入睡 · 慢慢趴下',wake:'醒来 · 抬头坐起',respond:'回应 · 抬头打招呼'},views=[];
for(const [id,name,tag]of [['capybara','卡皮巴拉','慢悠悠 · 小鸟一直陪在头顶'],['panda','熊猫','爱吃叶子 · 也爱睡个好觉']]){
 const card=document.createElement('article');card.innerHTML=`<div class="stage"><canvas width="256" height="256" aria-label="${name}动画"></canvas></div><div class="controls"><h2>${name}</h2><div class="tag">${tag}</div><select aria-label="${name}动作">${Object.entries(labels).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><div class="buttons"><button data-play>暂停</button><button data-flip>左右翻转</button></div><input type="range" min="0" max="7" value="0" step="1" aria-label="${name}帧号"><div class="caption"><span data-frame>第 1 / 8 帧</span><span>透明精灵图 · 逐帧播放</span></div></div>`;document.getElementById('cards').append(card);
 const v={id,card,ctx:card.querySelector('canvas').getContext('2d'),image:new Image(),ready:false,action:'idle',time:0,frame:0,playing:true,facing:1};views.push(v);v.image.onload=()=>{v.ready=true;draw(v);};v.image.src=GARDEN_ANIMAL_ATLAS.atlases[id].src;
 card.querySelector('select').onchange=e=>{v.action=e.target.value;v.time=0;v.frame=0;draw(v);};
 card.querySelector('[data-play]').onclick=e=>{v.playing=!v.playing;e.target.textContent=v.playing?'暂停':'播放';};
 card.querySelector('[data-flip]').onclick=()=>{v.facing*=-1;draw(v);};
 card.querySelector('input').oninput=e=>{v.playing=false;card.querySelector('[data-play]').textContent='播放';v.frame=Number(e.target.value);const c=GardenAnimalMotion.clipFor(v.id,v.action);v.time=(c.reverse?c.count-1-v.frame:v.frame)/c.fps;draw(v);};
}
function draw(v){if(!v.ready)return;const c=GardenAnimalMotion.clipFor(v.id,v.action);GardenAnimalRenderer.drawFrame(v.ctx,v.id,c.row,v.frame,v.facing,v.image);v.card.querySelector('input').max=c.count-1;v.card.querySelector('input').value=v.frame;v.card.querySelector('[data-frame]').textContent=`第 ${v.frame+1} / ${c.count} 帧`;}
let last=0;function tick(now){const dt=last?Math.min(.06,(now-last)/1000):0;last=now;for(const v of views)if(v.playing){const c=GardenAnimalMotion.clipFor(v.id,v.action);v.time+=dt;let frame=Math.floor(v.time*c.fps)%c.count;if(c.reverse)frame=c.count-1-frame;if(frame!==v.frame){v.frame=frame;draw(v);}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
