<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#31503b"><link rel="icon" href="data:,">
<title>习惯花园 · 种下小小的美好</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="intro"><span class="eyebrow">A LITTLE GARDEN OF YOUR OWN</span><h1>习惯花园<span>种下小小的美好。</span></h1><p>播下一颗种子，等一朵花开。<br>和可爱的伙伴一起，慢慢建造你的花园。</p><div class="intro-rule"></div><div class="instructions"><b>你的第一天</b><p><span>01</span>种植与收获，让花园慢慢长大</p><p><span>02</span>出售收获物，迎接动物伙伴</p><p><span>03</span>开垦与装扮，留下一点自己的模样</p></div><small>进度自动保存在当前浏览器 · 离开后植物继续成长</small></aside>
<main id="game" aria-label="习惯花园小游戏">
<header class="hud"><button id="levelButton" class="level-block" aria-label="查看家园等级"><span class="level-emblem"><img src="assets/coral/sprites/plants/daisy/plant_daisy_sprout.png" alt=""></span><b class="level-number">Lv.<span id="level">1</span></b><span class="xp-track"><i id="xpBar"></i></span><span id="xpText">0/20</span></button><span class="coins"><img src="assets/coral/icons/core/icon_coin.png" alt="金币"><b id="coins">50</b></span><button id="warehouse" class="warehouse iconbutton" aria-label="打开仓库"><img src="assets/coral/icons/core/icon_warehouse.png" alt=""><span>仓库</span><i id="warehouseBadge"></i></button></header>
<section id="viewport" aria-label="花园地图"><div id="world"><img class="background" src="assets/coral/garden.png" draggable="false" alt="手绘花园，小屋、小店、池塘和草地"><div id="editGrid"></div><div id="plots"></div><div id="objects"></div><div id="animals"></div></div><div id="buffs"></div><span id="modeLabel">自由浏览 · 拖动探索花园</span></section>
<div id="guide" role="status"></div><section id="tray" aria-label="操作工具"></section>
<nav id="nav"><button id="shop"><img src="assets/coral/icons/core/icon_shop.png" alt=""><span>商店</span><i id="shopDot"></i></button><button id="edit"><img src="assets/coral/icons/core/icon_edit.png" alt=""><span>编辑</span></button><button id="settings"><img src="assets/coral/icons/core/icon_settings.png" alt=""><span>设置</span></button></nav>
<div id="modal" class="modal" hidden></div><div id="confirm" class="modal confirm" hidden></div><div id="toast" role="status" aria-live="polite"></div><div id="dragGhost"></div><div id="fx"></div>
</main><script src="model.js"></script><script src="app.js"></script></body></html>
